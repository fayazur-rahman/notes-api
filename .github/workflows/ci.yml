name: CI

on: 
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]

permissions:
  contents: read
  id-token: write 

jobs: 
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Configure AWS Credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::034866042287:role/notes-api-gha-role
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push image
        if: github.event_name == 'push'
        env: 
          REGISTRY: 034866042287.dkr.ecr.us-east-1.amazonaws.com
          SHA: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/notes-api:$SHA -t $REGISTRY/notes-api:latest .
          docker push $REGISTRY/notes-api:$SHA
          docker push $REGISTRY/notes-api:latest

  deploy: 
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export REGISTRY=034866042287.dkr.ecr.us-east-1.amazonaws.com
            aws ecr get-login-password --region us-east-1 \
              | docker login --username AWS --password-stdin $REGISTRY
            
            docker pull $REGISTRY/notes-api:${{ github.sha }}
            docker rm -f notes-api || true
            docker run -d --name notes-api \
              --env-file /home/ubuntu/.env \
              -p 127.0.0.1:3000:3000 \
              --restart unless-stopped \
              $REGISTRY/notes-api:${{ github.sha }}
            docker ps -a
 