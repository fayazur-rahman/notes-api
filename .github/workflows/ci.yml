name: CI

on: 
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]

jobs: 
  hello:
    runs-on: ubuntu-latest
    env:
      GREETING: ${ { secrets.PIPELINE_GREETING } }
    steps:
      - name: Secret is masked in logs
        run: echo "The secret is: ${GREETING}"
        
    steps:
      - name: Inspect the runner BEFORE checkout
        run: |
          echo "who/where am I:"
          uname -a
          pwd
          ls -la          # nearly empty — your code is NOT here yet


      - name: Check out the repository
        uses: actions/checkout@v4


      - name: Inspect AFTER checkout
        run: |
          echo "now the repo is here:"
          ls -la          # your files appeared

